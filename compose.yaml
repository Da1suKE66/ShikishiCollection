services:
  shikishi:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      X_API_BEARER_TOKEN: ${X_API_BEARER_TOKEN:-}
      APP_ORIGIN: ${APP_ORIGIN:-}
    volumes:
      - shikishi-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  shikishi-data:
